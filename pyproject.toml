[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqresp"
version = "0.1.0"
description = "Cliente HTTP simplificado no terminal (estilo Insomnia)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=0.80",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
reqresp = "reqresp.web.server:main"
reqresp-tui = "reqresp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reqresp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
