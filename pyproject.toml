[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev_requests"
version = "0.1.0"
description = "Cliente HTTP simplificado no estilo do Insomnia (navegador e terminal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=0.80",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
dev_requests = "dev_requests.web.server:main"
dev_requests_tui = "dev_requests.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_requests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
